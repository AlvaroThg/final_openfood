# Paquete compartido `nutriscore`: ÚNICO lugar con el contrato de datos, la limpieza,
# el preprocesamiento, el entrenamiento, la evaluación, la política de calidad y el
# ciclo de vida de modelos. Lo instalan el notebook, retrain_service e ia_backend.
#
# Las versiones están fijadas EXACTAMENTE: un artefacto joblib solo es confiable si se carga
# con las mismas versiones con las que se entrenó (artifacts.py lo verifica al cargar).

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriscore"
version = "1.0.0"
description = "Contrato de datos y pipeline de ML para predecir el Nutri-Score (A-E)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
    "joblib==1.5.2",
    "pyarrow==21.0.0",
]

[project.optional-dependencies]
notebook = ["matplotlib==3.10.7", "kagglehub==0.3.13"]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.setuptools.packages.find]
include = ["nutriscore*"]
