# Configuración de herramientas para todo el monorepo (no es un paquete instalable).
# Los paquetes reales son ml/ (nutriscore) y cada servicio en services/.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna
# S: seguridad (bandit) · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nutriscore", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # assert, contraseñas de prueba, random no criptográfico

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib evita choques entre archivos de test con el mismo nombre en carpetas distintas.
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: tarda más de unos segundos (se puede omitir con -m 'not slow')",
    "integration: requiere PostgreSQL real (variable TEST_DATABASE_URL)",
    "e2e: requiere el stack levantado con docker compose",
]
filterwarnings = [
    # Un UserWarning suele delatar una discrepancia real (p. ej. columnas distintas entre
    # entrenamiento y predicción): se trata como error.
    "error::UserWarning",
    # LightGBM avisa cuando un split no mejora; es ruido en datos sintéticos pequeños.
    "ignore:.*No further splits with positive gain.*",
]
